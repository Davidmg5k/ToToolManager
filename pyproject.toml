[project]
name = "to-tool-manager"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Conectar Wali SAS", email = "conectarwalisas@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ornator",
    "pydantic-ai>=2.10.0",
    "pydantic-ai-harness>=0.7.0",
    "pydantic-ai-skills>=1.2.0",
    "pydantic-ai-slim[groq]>=2.10.0",
]

[project.scripts]
to-tool-manager = "to_tool_manager:main"

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"
