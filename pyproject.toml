[project]
name = "to-tool-manager"
version = "0.3.6"
description = "Convert Python service classes into AI tool specifications for LLM integration"
readme = "README.md"
authors = [
    { name = "Conectar Wali SAS", email = "conectarwalisas@gmail.com" }
]
requires-python = ">=3.12"
license = "MIT"
repository = "https://github.com/Davidmg5k/ToToolManager"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
pydantic-ai = [
    "pydantic-ai>=2.10.0",
    "pydantic-ai-harness>=0.7.0",
    "pydantic-ai-skills>=1.2.0",
    "subagents-pydantic-ai>=0.2.10",
]

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fastapi[standard]>=0.139.2",
    "sqlmodel>=0.0.39",
    "pydantic-ai-slim[groq]>=2.10.0",
    "pytest>=9.1.1",
    "httpx>=0.28.1",
]
