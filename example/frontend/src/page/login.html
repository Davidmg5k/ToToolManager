{% extends 'layout/layout.html' %}

{% block title %}Sign In — ToToolManager{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center relative">
    <div class="w-full max-w-md relative">
        <div class="text-center mb-8">
            <a href="/" class="inline-flex items-center gap-2 mb-6">
                <span class="flex items-center justify-center w-8 h-8 rounded-md bg-gradient-to-br from-brand-400 to-brand-600 text-ink-950 font-display font-bold text-sm">T</span>
                <span class="text-xl font-display font-bold text-ink-900">ToToolManager</span>
            </a>
            <p class="kicker text-[10px] text-brand-700 mb-2">Authentication Required</p>
            <h1 class="text-2xl font-display font-bold text-ink-900 cursor-blink">Sign in to your account</h1>
            <p class="text-sm text-ink-600 mt-2">Access the admin dashboard and AI chat</p>
        </div>

        <div class="hud-corners hud-corners-active bg-paper-100 rounded-xl shadow-panel border border-paper-300 p-8">
            <form hx-post="/api/auth/login" hx-target="#login-result" hx-swap="innerHTML" hx-indicator="#login-spinner">
                <div class="space-y-5">
                    <div>
                        <label for="email" class="block text-xs font-mono uppercase tracking-wide font-medium text-ink-600 mb-1.5">Email address</label>
                        <input type="email" id="email" name="email" required autofocus autocomplete="email"
                               class="w-full px-4 py-2.5 bg-paper-100 border border-paper-400 rounded-lg shadow-sm text-ink-900 placeholder:text-ink-500 focus:ring-2 focus:ring-brand-400/40 focus:border-brand-400 text-sm"
                               placeholder="admin@ttm.com">
                    </div>
                    <div>
                        <label for="password" class="block text-xs font-mono uppercase tracking-wide font-medium text-ink-600 mb-1.5">Password</label>
                        <input type="password" id="password" name="password" required autocomplete="current-password"
                               class="w-full px-4 py-2.5 bg-paper-100 border border-paper-400 rounded-lg shadow-sm text-ink-900 placeholder:text-ink-500 focus:ring-2 focus:ring-brand-400/40 focus:border-brand-400 text-sm"
                               placeholder="Enter your password">
                    </div>
                    <button type="submit"
                            class="w-full py-2.5 px-4 bg-brand-400 text-ink-950 font-semibold rounded-lg hover:bg-brand-300 focus:ring-2 focus:ring-brand-400 focus:ring-offset-2 focus:ring-offset-paper-100 shadow-brand transition-colors text-sm inline-flex items-center justify-center gap-2">
                        <svg id="login-spinner" class="htmx-indicator animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                        </svg>
                        Sign In
                    </button>
                </div>
                <div id="login-result" class="mt-4"></div>
            </form>
        </div>

        <p class="text-center text-sm text-ink-600 mt-6">
            <a href="/" class="text-accent-700 hover:text-accent-600 font-medium">&larr; Back to home</a>
        </p>
    </div>
</div>
{% endblock %}
