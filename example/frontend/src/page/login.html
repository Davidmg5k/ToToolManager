{% extends 'layout/layout.html' %}

{% block title %}Sign In — ToToolManager{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <a href="/" class="inline-flex items-center gap-2 mb-6">
                <span class="text-2xl font-bold text-indigo-600">ToToolManager</span>
            </a>
            <h1 class="text-2xl font-bold text-gray-900">Sign in to your account</h1>
            <p class="text-sm text-gray-500 mt-2">Access the admin dashboard and AI chat</p>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8">
            <form hx-post="/api/auth/login" hx-target="#login-result" hx-swap="innerHTML" hx-indicator="#login-spinner">
                <div class="space-y-5">
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-1.5">Email address</label>
                        <input type="email" id="email" name="email" required autofocus autocomplete="email"
                               class="w-full px-4 py-2.5 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm"
                               placeholder="admin@ttm.com">
                    </div>
                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
                        <input type="password" id="password" name="password" required autocomplete="current-password"
                               class="w-full px-4 py-2.5 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm"
                               placeholder="Enter your password">
                    </div>
                    <button type="submit"
                            class="w-full py-2.5 px-4 bg-indigo-600 text-white font-medium rounded-lg hover:bg-indigo-700 focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition-colors text-sm inline-flex items-center justify-center gap-2">
                        <svg id="login-spinner" class="htmx-indicator animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                        </svg>
                        Sign In
                    </button>
                </div>
                <div id="login-result" class="mt-4"></div>
            </form>
        </div>

        <p class="text-center text-sm text-gray-500 mt-6">
            <a href="/" class="text-indigo-600 hover:text-indigo-500 font-medium">&larr; Back to home</a>
        </p>
    </div>
</div>
{% endblock %}
