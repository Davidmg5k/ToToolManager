<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ToToolManager{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12/dist/client-ext/sse.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    {% block head %}{% endblock %}
</head>
<body class="h-full">
    {% block body %}
    <div class="min-h-full" x-data="{ sidebarOpen: false }">
        {% include 'component/navbar.html' %}

        <div class="flex">
            {% if admin is defined and admin %}
                {% include 'component/sidebar.html' %}
            {% endif %}

            <main class="flex-1 py-6 px-4 sm:px-6 lg:px-8">
                {% block content %}{% endblock %}
            </main>
        </div>

        {% include 'component/footer.html' %}
    </div>
    {% endblock %}

    <!-- Error Toast Container -->
    <div id="error-toast-container" class="fixed bottom-4 left-4 z-50 space-y-2"></div>

    <script src="/static/js/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
