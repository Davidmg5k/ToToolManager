<div class="hud-corners bg-paper-100 shadow-panel border border-paper-300 rounded-xl overflow-hidden">
    <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-paper-300">
            <thead class="bg-paper-200/70">
                <tr>
                    <template x-for="col in columns" :key="col.key">
                        <th @click="sortBy(col)"
                            :class="col.sortable ? 'cursor-pointer select-none hover:text-ink-900' : ''"
                            class="px-6 py-3 text-left text-xs font-mono font-semibold text-ink-600 uppercase tracking-wider whitespace-nowrap">
                            <span class="inline-flex items-center gap-1">
                                <span x-text="col.label"></span>
                                <template x-if="col.sortable">
                                    <svg class="w-3 h-3 transition-transform" :class="sortKey === col.key ? 'text-brand-600' : 'text-ink-500'" :style="sortKey === col.key && sortDir === -1 ? 'transform: rotate(180deg)' : ''" fill="currentColor" viewBox="0 0 20 20">
                                        <path fill-rule="evenodd" d="M10 3a1 1 0 01.707.293l4 4a1 1 0 01-1.414 1.414L10 5.414 6.707 8.707a1 1 0 01-1.414-1.414l4-4A1 1 0 0110 3zm-4.707 9.293a1 1 0 011.414 0L10 15.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/>
                                    </svg>
                                </template>
                            </span>
                        </th>
                    </template>
                    <th class="px-6 py-3 text-right text-xs font-mono font-semibold text-ink-600 uppercase tracking-wider">Actions</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-paper-300/70">
                <!-- loading skeleton -->
                <template x-if="loading">
                    <template x-for="n in 4" :key="n">
                        <tr>
                            <template x-for="col in columns" :key="col.key">
                                <td class="px-6 py-4"><div class="skeleton h-3.5 rounded w-3/4"></div></td>
                            </template>
                            <td class="px-6 py-4"><div class="skeleton h-3.5 rounded w-10 ml-auto"></div></td>
                        </tr>
                    </template>
                </template>

                <!-- error state -->
                <template x-if="!loading && loadError">
                    <tr>
                        <td :colspan="columns.length + 1" class="px-6 py-10 text-center">
                            <p class="text-sm font-medium text-danger-600">Couldn't load this data.</p>
                            <button @click="load()" class="mt-2 text-sm text-accent-700 hover:text-accent-600 font-medium">Try again</button>
                        </td>
                    </tr>
                </template>

                <!-- empty state -->
                <template x-if="!loading && !loadError && filteredItems.length === 0">
                    <tr>
                        <td :colspan="columns.length + 1" class="px-6 py-12 text-center">
                            <template x-if="query">
                                <p class="text-sm text-ink-600">No results for &ldquo;<span x-text="query"></span>&rdquo;.</p>
                            </template>
                            <template x-if="!query">
                                <div>
                                    <p class="text-sm font-medium text-ink-900">No records yet</p>
                                    <p class="text-sm text-ink-500 mt-0.5">Click &ldquo;New {{ singular }}&rdquo; to create the first one.</p>
                                </div>
                            </template>
                        </td>
                    </tr>
                </template>

                <!-- rows -->
                <template x-if="!loading && !loadError">
                    <template x-for="item in filteredItems" :key="item[config.idField]">
                        <tr class="hover:bg-paper-200/70 transition-colors">
                            <template x-for="col in columns" :key="col.key">
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-ink-600" x-html="formatCell(col, item)"></td>
                            </template>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-right space-x-1">
                                <button @click="openEdit(item)" title="Edit" class="text-accent-600 hover:text-accent-700 p-1.5 rounded-lg hover:bg-accent-50 transition-colors">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                                </button>
                                <button @click="remove(item)" title="Delete" class="text-danger-500 hover:text-danger-600 p-1.5 rounded-lg hover:bg-danger-50 transition-colors">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                                </button>
                            </td>
                        </tr>
                    </template>
                </template>
            </tbody>
        </table>
    </div>
</div>
