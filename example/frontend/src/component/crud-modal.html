<div x-show="modalOpen"
     x-cloak
     @keydown.escape.window="closeModal()"
     class="fixed inset-0 bg-gray-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-4"
     x-transition:enter="transition ease-out duration-150"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="transition ease-in duration-100"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0">
    <div @click.outside="closeModal()"
         x-ref="modal"
         role="dialog"
         aria-modal="true"
         class="bg-white rounded-xl shadow-xl max-w-md w-full p-6"
         x-transition:enter="transition ease-out duration-150"
         x-transition:enter-start="opacity-0 scale-95"
         x-transition:enter-end="opacity-100 scale-100">
        <div class="flex items-center justify-between mb-4">
            <h3 class="text-lg font-semibold text-gray-900" x-text="(modalMode === 'create' ? 'New ' : 'Edit ') + config.label"></h3>
            <button @click="closeModal()" class="text-gray-400 hover:text-gray-600 p-1 rounded-lg hover:bg-gray-100" aria-label="Close">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>

        <form @submit.prevent="submit()">
            <div class="space-y-4">
                <template x-for="f in activeFields" :key="f.name">
                    <div>
                        <label :for="'field-' + f.name" class="block text-xs font-medium text-gray-500 mb-1" x-text="f.label"></label>

                        <template x-if="f.type === 'textarea'">
                            <textarea :id="'field-' + f.name" x-model="form[f.name]" :required="f.required && !f.optionalOnEdit"
                                      :placeholder="f.placeholder || ''" rows="3"
                                      class="w-full px-3.5 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"></textarea>
                        </template>

                        <template x-if="f.type === 'select'">
                            <select :id="'field-' + f.name" x-model="form[f.name]" :required="f.required"
                                    class="w-full px-3.5 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                                <template x-for="opt in f.options" :key="opt.value">
                                    <option :value="opt.value" x-text="opt.label"></option>
                                </template>
                            </select>
                        </template>

                        <template x-if="!['textarea', 'select'].includes(f.type)">
                            <input :id="'field-' + f.name" x-model="form[f.name]" :type="f.type || 'text'"
                                   :required="f.required && !(modalMode === 'edit' && f.optionalOnEdit)"
                                   :step="f.step" :min="f.min"
                                   :placeholder="modalMode === 'edit' && f.editPlaceholder ? f.editPlaceholder : (f.placeholder || '')"
                                   class="w-full px-3.5 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                        </template>
                    </div>
                </template>
            </div>

            <div class="flex justify-end gap-3 mt-6">
                <button type="button" @click="closeModal()"
                        class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50">
                    Cancel
                </button>
                <button type="submit" :disabled="submitting"
                        class="inline-flex items-center gap-2 px-4 py-2 text-sm font-medium text-white bg-indigo-600 rounded-lg hover:bg-indigo-700 disabled:opacity-60 shadow-sm">
                    <svg x-show="submitting" class="animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                    </svg>
                    <span x-text="submitting ? 'Saving…' : (config.submitLabel || 'Save')"></span>
                </button>
            </div>
        </form>
    </div>
</div>
